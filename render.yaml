services:
  - type: web
    name: istanbul-cafe-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python istanbul_cafe_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEB_URL
        sync: false
      - key: PORT
        value: 10000
